# Observe: every provider's native API through one gateway. Clients keep their SDKs and keys;
# Envoy validates and describes each request, reads the token usage of each response, and
# forwards the client's bytes unchanged.
static_resources:
  listeners:
  - name: observe
    address:
      socket_address: {address: 0.0.0.0, port_value: 10000}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: observe
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  status: "%RESPONSE_CODE%"
                  model: "%FILTER_STATE(envoy.ai.model.request:PLAIN)%"
                  request_info: "%TYPED_CEL(metadata.typed_filter_metadata['envoy.ai.request_info'])%"
                  token_usage: "%TYPED_CEL(metadata.typed_filter_metadata['envoy.ai.token_usage'])%"
          route_config:
            virtual_hosts:
            - name: providers
              domains: ["*"]
              request_headers_to_remove: [accept-encoding]
              routes:
              - match: {path: /v1/chat/completions}
                route: {cluster: openai, auto_host_rewrite: true}
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
              - match: {path: /v1/responses}
                route: {cluster: openai, auto_host_rewrite: true}
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_RESPONSES}
              - match: {path: /v1/messages}
                route: {cluster: anthropic, auto_host_rewrite: true}
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: ANTHROPIC_MESSAGES}
              - match: {prefix: /v1beta/models/}
                route: {cluster: gemini, auto_host_rewrite: true}
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: GEMINI_GENERATE_CONTENT}
          http_filters:
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {reserialize_body: DISABLE}
              response_handling: {token_usage: {}}
              filters:
              - name: envoy.http.ai_filters.schema_validation
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.schema_validation.v3.SchemaValidation
              - name: envoy.http.ai_filters.request_info
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.request_info.v3.RequestInfo
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: openai
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: openai
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: api.openai.com, port_value: 443}}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.openai.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: api.openai.com}}]
  - name: anthropic
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: anthropic
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: api.anthropic.com, port_value: 443}}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.anthropic.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: api.anthropic.com}}]
  - name: gemini
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: gemini
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: generativelanguage.googleapis.com, port_value: 443}}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: generativelanguage.googleapis.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: generativelanguage.googleapis.com}}]
