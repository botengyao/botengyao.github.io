# Gateway: any client API to any backend API. One filter chain for every route; each route
# names the client's API, the backend's API, and how the backend carries it on HTTP.
# The base URL picks the backend and the path the client's API:
#   OpenAI SDK      base_url=http://localhost:10000/claude/v1     -> Claude
#   Claude Code     ANTHROPIC_BASE_URL=http://localhost:10000/gemini -> Gemini
#   Google GenAI    base_url=http://localhost:10000/claude        -> Claude
static_resources:
  listeners:
  - name: gateway
    address:
      socket_address: {address: 0.0.0.0, port_value: 10000}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gateway
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  status: "%RESPONSE_CODE%"
                  client_model: "%FILTER_STATE(envoy.ai.model.request:PLAIN)%"
                  backend_model: "%FILTER_STATE(envoy.ai.model.resolved:PLAIN)%"
                  upstream_path: "%REQ(:PATH)%"
                  attempts: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"
                  token_usage: "%TYPED_CEL(metadata.typed_filter_metadata['envoy.ai.token_usage'])%"
          route_config:
            most_specific_header_mutations_wins: true
            virtual_hosts:
            - name: gateway
              domains: ["*"]
              request_headers_to_remove: [authorization, x-api-key, x-goog-api-key, accept-encoding]
              routes:
              # OpenAI clients -> Claude. Retried once on a 5xx with the same transcoded body.
              - match: {path: /claude/v1/chat/completions}
                route:
                  cluster: anthropic
                  auto_host_rewrite: true
                  retry_policy: {retry_on: 5xx, num_retries: 1}
                request_headers_to_add: &anthropic_key
                - header: {key: x-api-key, value: "%ENVIRONMENT(ANTHROPIC_API_KEY)%"}
                - header: {key: anthropic-version, value: "2023-06-01"}
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: ANTHROPIC_MESSAGES, binding: {uri_pattern: /v1/messages}}
              # Google GenAI clients -> Claude. The prefix is the gateway's, so the route says
              # where the model sits in the client's path.
              - match: {prefix: /claude/v1beta/models/}
                route: {cluster: anthropic, auto_host_rewrite: true}
                request_headers_to_add: *anthropic_key
                typed_per_filter_config:
                  envoy.filters.http.set_filter_state:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
                    on_request_headers:
                    - object_key: envoy.ai.model.resolved
                      format_string: {text_format_source: {inline_string: claude-sonnet-4-5}}
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request:
                      llm_protocol: GEMINI_GENERATE_CONTENT
                      binding: {uri_pattern: "/claude/v1beta/models/{model}:{generateContent|streamGenerateContent?alt=sse}"}
                    response: {llm_protocol: ANTHROPIC_MESSAGES, binding: {uri_pattern: /v1/messages}}
              # OpenAI clients -> Gemini. Gemini's own path needs no binding.
              - match: {path: /gemini/v1/chat/completions}
                route: {cluster: gemini, auto_host_rewrite: true}
                request_headers_to_add: &gemini_key
                - header: {key: x-goog-api-key, value: "%ENVIRONMENT(GEMINI_API_KEY)%"}
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response: {llm_protocol: GEMINI_GENERATE_CONTENT}
              # Claude Code -> Gemini, with the gateway's choice of model.
              - match: {path: /gemini/v1/messages}
                route: {cluster: gemini, auto_host_rewrite: true}
                request_headers_to_add: *gemini_key
                typed_per_filter_config:
                  envoy.filters.http.set_filter_state: &gemini_model
                    "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
                    on_request_headers:
                    - object_key: envoy.ai.model.resolved
                      format_string: {text_format_source: {inline_string: gemini-2.5-flash}}
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: ANTHROPIC_MESSAGES}
                    response: {llm_protocol: GEMINI_GENERATE_CONTENT}
              # Claude Code -> any OpenAI-compatible backend.
              - match: {path: /openai/v1/messages}
                route: {cluster: openai, auto_host_rewrite: true}
                request_headers_to_add:
                - header: {key: authorization, value: "Bearer %ENVIRONMENT(OPENAI_API_KEY)%"}
                typed_per_filter_config:
                  envoy.filters.http.set_filter_state:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
                    on_request_headers:
                    - object_key: envoy.ai.model.resolved
                      format_string: {text_format_source: {inline_string: gpt-4o-mini}}
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: ANTHROPIC_MESSAGES}
                    response: {llm_protocol: OPENAI_CHAT_COMPLETIONS, binding: {uri_pattern: /v1/chat/completions}}
              # OpenAI clients -> Claude on Vertex AI: the model goes in the path, the Vertex AI
              # version in the body.
              - match: {path: /vertex/claude/v1/chat/completions}
                route: {cluster: vertex, auto_host_rewrite: true}
                request_headers_to_add: &vertex_token
                - header: {key: authorization, value: "Bearer %ENVIRONMENT(VERTEX_ACCESS_TOKEN)%"}
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response:
                      llm_protocol: ANTHROPIC_MESSAGES
                      binding:
                        uri_pattern: "/v1/projects/my-project/locations/us-east5/publishers/anthropic/models/{model}:{rawPredict|streamRawPredict}"
                        mutations:
                        - {body_field: model}
                        - {body_field: anthropic_version, value: vertex-2023-10-16, keep_existing: true}
              # OpenAI clients -> Gemini on Vertex AI: a path is enough.
              - match: {path: /vertex/gemini/v1/chat/completions}
                route: {cluster: vertex, auto_host_rewrite: true}
                request_headers_to_add: *vertex_token
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
                    response:
                      llm_protocol: GEMINI_GENERATE_CONTENT
                      binding: {uri_pattern: "/v1/projects/my-project/locations/us-east5/publishers/google/models/{model}:{generateContent|streamGenerateContent?alt=sse}"}
              # Claude Code on Vertex AI (native paths) -> Gemini, in the client's project and region.
              #   CLAUDE_CODE_USE_VERTEX=1 ANTHROPIC_VERTEX_BASE_URL=http://localhost:10000/v1
              - match: {prefix: /v1/projects/}
                route: {cluster: vertex, auto_host_rewrite: true}
                request_headers_to_add: *vertex_token
                typed_per_filter_config:
                  envoy.filters.http.set_filter_state: *gemini_model
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: ANTHROPIC_MESSAGES}
                    response:
                      llm_protocol: GEMINI_GENERATE_CONTENT
                      binding: {uri_pattern: "/{version}/projects/{project}/locations/{location}/publishers/google/models/{model}:{generateContent|streamGenerateContent?alt=sse}"}
          http_filters:
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {}
              response_handling: {token_usage: {}}
              filters:
              - name: envoy.http.ai_filters.request_info
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.request_info.v3.RequestInfo
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: TO_IR
                  response_handling: FROM_IR
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: FROM_IR
                  response_handling: TO_IR
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: anthropic
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: anthropic
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: api.anthropic.com, port_value: 443}}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.anthropic.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: api.anthropic.com}}]
  - name: gemini
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: gemini
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: generativelanguage.googleapis.com, port_value: 443}}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: generativelanguage.googleapis.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: generativelanguage.googleapis.com}}]
  - name: openai
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: openai
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: api.openai.com, port_value: 443}}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.openai.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: api.openai.com}}]
  - name: vertex
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: vertex
      endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: us-east5-aiplatform.googleapis.com, port_value: 443}}}}]}]
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: us-east5-aiplatform.googleapis.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: us-east5-aiplatform.googleapis.com}}]
