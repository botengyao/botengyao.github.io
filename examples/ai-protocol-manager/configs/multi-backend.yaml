# Multi-backend: one route, several backends with different APIs, picked by weight, by retry
# attempt, or by the model the client asks for.
#
# The transcoding is split in two. The edge converts the client's API to the common form once.
# The backend half runs on each attempt, after the cluster and host are picked, and takes that
# backend's API, path and model from the endpoint's metadata. A retry to another backend is
# transcoded for that backend.
static_resources:
  listeners:
  - name: gateway
    address:
      socket_address: {address: 0.0.0.0, port_value: 10000}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: gateway
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  status: "%RESPONSE_CODE%"
                  client_model: "%FILTER_STATE(envoy.ai.model.request:PLAIN)%"
                  backend_api: "%FILTER_STATE(envoy.ai.llm_protocol.response:FIELD:llm_protocol)%"
                  upstream: "%UPSTREAM_HOST_NAME%%REQ(:PATH)%"
                  attempts: "%UPSTREAM_REQUEST_ATTEMPT_COUNT%"
                  token_usage: "%TYPED_CEL(metadata.typed_filter_metadata['envoy.ai.token_usage'])%"
          route_config:
            most_specific_header_mutations_wins: true
            virtual_hosts:
            - name: gateway
              domains: ["*"]
              request_headers_to_remove: [authorization, x-api-key, x-goog-api-key, accept-encoding]
              routes:
              # Split: half to Claude, half to Gemini.
              - match: {path: /split/v1/chat/completions}
                route:
                  weighted_clusters:
                    clusters: [{name: vertex_claude, weight: 50}, {name: vertex_gemini, weight: 50}]
                  auto_host_rewrite: true
                request_headers_to_add: &vertex_token
                - header: {key: authorization, value: "Bearer %ENVIRONMENT(VERTEX_ACCESS_TOKEN)%"}
                typed_per_filter_config: &openai_clients
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: OPENAI_CHAT_COMPLETIONS}
              # Failover: Claude first, Gemini on the retry (composite cluster).
              - match: {path: /failover/v1/chat/completions}
                route: {cluster: vertex_failover, auto_host_rewrite: true, retry_policy: {retry_on: 5xx, num_retries: 1}}
                request_headers_to_add: *vertex_token
                typed_per_filter_config: *openai_clients
              # The same failover for Claude Code.
              - match: {path: /failover/v1/messages}
                route: {cluster: vertex_failover, auto_host_rewrite: true, retry_policy: {retry_on: 5xx, num_retries: 1}}
                request_headers_to_add: *vertex_token
                typed_per_filter_config:
                  envoy.filters.http.ai_protocol_manager:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManagerPerRoute
                    request: {llm_protocol: ANTHROPIC_MESSAGES}
              # Failover across providers with their own keys: Anthropic, then Gemini
              # (priority group cluster specifier). Each cluster brings its key.
              - match: {path: /fallback/v1/chat/completions}
                route:
                  inline_cluster_specifier_plugin:
                    extension:
                      name: envoy.router.cluster_specifier_plugin.priority_group
                      typed_config:
                        "@type": type.googleapis.com/envoy.extensions.router.cluster_specifiers.priority_group.v3.PriorityGroupClusterSpecifier
                        priority_groups:
                        - {name: primary, clusters: [{cluster_name: anthropic, weight: 1}]}
                        - {name: fallback, clusters: [{cluster_name: gemini, weight: 1}]}
                  auto_host_rewrite: true
                  retry_policy: {retry_on: 5xx, num_retries: 1, refresh_cluster_on_retry: true}
                typed_per_filter_config: *openai_clients
              # By model: these routes match the model request_info read from the body, once
              # set_filter_state refreshes the route.
              - match:
                  path: /v1/chat/completions
                  filter_state: [{key: envoy.ai.model.request, string_match: {prefix: claude-}}]
                route: {cluster: vertex_claude, auto_host_rewrite: true}
                request_headers_to_add: *vertex_token
                typed_per_filter_config: *openai_clients
              - match:
                  path: /v1/chat/completions
                  filter_state: [{key: envoy.ai.model.request, string_match: {prefix: gemini-}}]
                route: {cluster: vertex_gemini, auto_host_rewrite: true}
                request_headers_to_add: *vertex_token
                typed_per_filter_config: *openai_clients
              # Matched before the model is known, and after for a model no backend serves.
              - match: {path: /v1/chat/completions}
                direct_response: {status: 404, body: {inline_string: "no backend serves this model"}}
                typed_per_filter_config: *openai_clients
          http_filters:
          # Client half: the client's API to the common form, and back.
          - name: envoy.filters.http.ai_protocol_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
              request_handling: {}
              filters:
              - name: envoy.http.ai_filters.request_info
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.request_info.v3.RequestInfo
              - name: envoy.http.ai_filters.transcoder
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                  request_handling: TO_IR
                  response_handling: FROM_IR
          - name: envoy.filters.http.set_filter_state
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.set_filter_state.v3.Config
              clear_route_cache: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              # Backend half, on every attempt to a cluster without filters of its own.
              upstream_http_filters:
              # What the picked endpoint says about its backend...
              - &backend
                name: envoy.filters.http.header_mutation
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                  mutations:
                    request_mutations:
                    - append: {header: {key: x-ai-api, value: "%UPSTREAM_METADATA(envoy.ai:api)%"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
                    - append: {header: {key: x-ai-binding, value: "%UPSTREAM_METADATA(envoy.ai:binding)%"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
                    - append: {header: {key: x-ai-model, value: "%UPSTREAM_METADATA(envoy.ai:model)%"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
              # ...becomes the AIPM's instructions (set_filter_state cannot run on a cluster).
              - &instructions
                name: envoy.filters.http.lua
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: |
                      function envoy_on_request(handle)
                        local state = handle:streamInfo():filterState()
                        for header, key in pairs({["x-ai-api"] = "envoy.ai.llm_protocol.response",
                                                  ["x-ai-binding"] = "envoy.ai.binding.response",
                                                  ["x-ai-model"] = "envoy.ai.model.resolved"}) do
                          state:set(key, key, handle:headers():get(header))
                          handle:headers():remove(header)
                        end
                      end
              - &backend_half
                name: envoy.filters.http.ai_protocol_manager
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.ai_protocol_manager.v3.AiProtocolManager
                  request_handling: {}
                  response_handling: {token_usage: {}}
                  filters:
                  - name: envoy.http.ai_filters.transcoder
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.http.ai_filters.transcoder.v3.Transcoder
                      request_handling: FROM_IR
                      response_handling: TO_IR
              - &codec
                name: envoy.filters.http.upstream_codec
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.upstream_codec.v3.UpstreamCodec
  clusters:
  - name: vertex_claude
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: vertex_claude
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: us-east5-aiplatform.googleapis.com, port_value: 443}}}
          metadata:
            filter_metadata:
              envoy.ai:
                api: ANTHROPIC_MESSAGES
                model: claude-sonnet-4-5@20250929
                binding:
                  uri_pattern: "/v1/projects/my-project/locations/us-east5/publishers/anthropic/models/{model}:{rawPredict|streamRawPredict}"
                  mutations:
                  - {body_field: model}
                  - {body_field: anthropic_version, value: vertex-2023-10-16, keep_existing: true}
    transport_socket: &vertex_tls
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: us-east5-aiplatform.googleapis.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: us-east5-aiplatform.googleapis.com}}]
  - name: vertex_gemini
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: vertex_gemini
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: us-east5-aiplatform.googleapis.com, port_value: 443}}}
          metadata:
            filter_metadata:
              envoy.ai:
                api: GEMINI_GENERATE_CONTENT
                model: gemini-2.5-flash
                binding: "/v1/projects/my-project/locations/us-east5/publishers/google/models/{model}:{generateContent|streamGenerateContent?alt=sse}"
    transport_socket: *vertex_tls
  - name: vertex_failover
    lb_policy: CLUSTER_PROVIDED
    cluster_type:
      name: envoy.clusters.composite
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.clusters.composite.v3.ClusterConfig
        clusters: [{name: vertex_claude}, {name: vertex_gemini}]
  # Providers with their own keys. A cluster's own filters replace the router's, so each adds its
  # key, and removes the other's, which an earlier attempt may have left on the request.
  - name: anthropic
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: anthropic
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: api.anthropic.com, port_value: 443}}}
          metadata:
            filter_metadata:
              envoy.ai: {api: ANTHROPIC_MESSAGES, model: claude-sonnet-4-5, binding: /v1/messages}
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http_protocol_options: {}}
        http_filters:
        - name: envoy.filters.http.header_mutation
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
            mutations:
              request_mutations:
              - remove: x-goog-api-key
              - append: {header: {key: x-api-key, value: "%ENVIRONMENT(ANTHROPIC_API_KEY)%"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
              - append: {header: {key: anthropic-version, value: "2023-06-01"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
        - *backend
        - *instructions
        - *backend_half
        - *codec
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: api.anthropic.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: api.anthropic.com}}]
  - name: gemini
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: gemini
      endpoints:
      - lb_endpoints:
        - endpoint: {address: {socket_address: {address: generativelanguage.googleapis.com, port_value: 443}}}
          metadata:
            filter_metadata:
              envoy.ai:
                api: GEMINI_GENERATE_CONTENT
                model: gemini-2.5-flash
                binding: "/v1beta/models/{model}:{generateContent|streamGenerateContent?alt=sse}"
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config: {http_protocol_options: {}}
        http_filters:
        - name: envoy.filters.http.header_mutation
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
            mutations:
              request_mutations:
              - remove: x-api-key
              - remove: anthropic-version
              - append: {header: {key: x-goog-api-key, value: "%ENVIRONMENT(GEMINI_API_KEY)%"}, append_action: OVERWRITE_IF_EXISTS_OR_ADD}
        - *backend
        - *instructions
        - *backend_half
        - *codec
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: generativelanguage.googleapis.com
        common_tls_context:
          validation_context:
            trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
            match_typed_subject_alt_names: [{san_type: DNS, matcher: {exact: generativelanguage.googleapis.com}}]
